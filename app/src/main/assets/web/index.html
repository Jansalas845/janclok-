<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Proto</title>
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--card:#fff;--user:#e9e6dc;--accent:#d97757;--bd:#ddd9cc}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#eee;--card:#30302e;--user:#3a3935;--bd:#4a4944}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);padding-top:max(14px,env(safe-area-inset-top))}
header b{font-family:Georgia,serif;font-size:20px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
#banner{display:none;padding:12px 16px;background:var(--user);font-size:14px;line-height:1.4}
#banner button{margin-top:8px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45}
.u{align-self:flex-end;background:var(--user)}.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);padding-bottom:max(10px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--fg);font-size:16px;font-family:inherit}
</style></head><body>
<header><b>Claude Proto <small style="font-weight:normal;opacity:.6">· offline</small></b><span><button class="g" id="clr">Nuevo</button> <button class="g" id="mdl">Modelo</button></span></header>
<div id="banner"><span id="bmsg">Falta el modelo. Elige un archivo <b>.task</b> (p. ej. Gemma 3 1B IT int4) guardado en tu teléfono.</span><br><button id="pick">Cargar modelo</button></div>
<div id="chat"></div>
<footer><textarea id="in" rows="2" placeholder="Escribe un mensaje…"></textarea><button id="send">Enviar</button></footer>
<script>
const $=id=>document.getElementById(id);
let hist=[],ready=false;const chat=$('chat');
function add(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function banner(show,msg){$('banner').style.display=show?'block':'none';if(msg)$('bmsg').textContent=msg}
async function status(){try{const j=await (await fetch('/api/status')).json();ready=j.modelLoaded;banner(!ready)}catch(e){}}
function onModelResult(m){if(m==='ok'){ready=true;banner(false)}else banner(true,m)}
$('pick').onclick=$('mdl').onclick=()=>{banner(true,'Copiando y cargando el modelo… puede tardar un minuto.');Android.pickModel()};
$('clr').onclick=()=>{hist=[];chat.innerHTML=''};
async function send(){
  const t=$('in').value.trim();if(!t)return;
  if(!ready){await status();if(!ready){banner(true);return}}
  $('in').value='';hist.push({role:'user',content:t});add('user',t);
  const el=add('assistant','…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:hist})});
    const j=await r.json();if(!r.ok)throw new Error(j.error);
    el.textContent=j.reply;hist.push({role:'assistant',content:j.reply});
  }catch(e){el.textContent='Error: '+e.message;hist.pop()}
}
$('send').onclick=send;
status();setTimeout(status,4000);
</script></body></html>
